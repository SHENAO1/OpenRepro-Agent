[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrepro-agent"
version = "1.8.1"
description = "A Python CLI workflow for paper reproduction setup, analysis, artifact validation, benchmarking, reporting, and multi-agent handoff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OpenRepro-Agent Contributors" }
]
keywords = ["research", "reproducibility", "CLI", "agent", "experiments"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "typer>=0.9",
  "pyyaml>=6.0",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "rich>=13.0",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
openrepro = "openrepro.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrepro = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
