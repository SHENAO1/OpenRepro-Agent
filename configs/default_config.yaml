project_name: openrepro_project
version: 0.7.2
description: Default OpenRepro-Agent configuration template.
demo:
  seed: 42
  code_length: 128
  samples_per_chip: 16
  subcarrier_cycles_per_chip: 2
  noise_std: 0.05
  output_name: boc_demo
api:
  default_provider: mock
  default_model: mock-llm
  enable_real_api: false
  api_key_env: OPENAI_API_KEY
  endpoint: https://api.openai.com/v1/chat/completions
  cache_enabled: true
  cache_ttl_seconds:
  redact_prompts: true
analysis:
  analyzer_version: v0.7.2-rule
  max_source_preview_chars: 4000
